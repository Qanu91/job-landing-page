<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instant Job Alerts</title>
    <style>
      :root {
        --whatsapp-green: #25d366;
        --whatsapp-dark: #128c7e;
        --bg-color: #f4f7f6;
        --card-bg: #ffffff;
        --text-main: #333333;
        --text-muted: #666666;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        background: var(--card-bg);
        max-width: 480px;
        width: 100%;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
        padding: 32px 24px;
        text-align: center;
      }

      .header h1 {
        font-size: 24px;
        font-weight: 800;
        line-height: 1.3;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: -0.5px;
      }

      .header p {
        color: var(--text-muted);
        font-size: 15px;
        margin-bottom: 28px;
        line-height: 1.5;
      }

      .cta-btn {
        display: block;
        background-color: var(--whatsapp-green);
        color: white;
        text-decoration: none;
        font-weight: 700;
        font-size: 16px;
        padding: 16px;
        border-radius: 12px;
        box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        transition:
          transform 0.2s,
          background-color 0.2s;
        margin-bottom: 8px;
      }

      .cta-btn:hover {
        background-color: var(--whatsapp-dark);
        transform: translateY(-1px);
      }

      .cta-subtext {
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 32px;
      }

      .feed-section {
        text-align: left;
        border-top: 1px solid #eaeaea;
        padding-top: 24px;
      }

      .feed-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 16px;
      }

      #job-feed {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .job-item {
        padding: 12px 0;
        border-bottom: 1px solid #f9f9f9;
      }

      .job-item:last-child {
        border-bottom: none;
      }

      .job-title {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .job-meta {
        font-size: 13px;
        color: var(--text-muted);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .job-link {
        color: var(--whatsapp-dark);
        text-decoration: none;
        font-weight: 600;
      }

      .job-link:hover {
        text-decoration: underline;
      }

      .loading,
      .error-msg {
        font-size: 14px;
        color: var(--text-muted);
        text-align: center;
        padding: 20px 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🚀 Never Miss a Remote Job Opening Again</h1>
        <p>
          We track 50+ tech boards so you don't have to. Get real-time alerts
          instantly.
        </p>
      </div>

      <!-- REPLACE THE HREF WITH YOUR ACTUAL WHATSAPP CHANNEL LINK -->
      <a
        href="https://whatsapp.com/channel/0029VbE7IEv89innkPoNfr3l"
        target="_blank"
        class="cta-btn"
        >🟢 JOIN THE WHATSAPP CHANNEL</a
      >
      <div class="cta-subtext">(Free • No Spam • Mute Anytime)</div>

      <div class="feed-section">
        <div class="feed-title">💼 Today's Featured Alerts</div>
        <div id="job-feed">
          <div class="loading">Loading fresh jobs...</div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
